{% load  static %}
<!doctype html>
<html lang=ru>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.6.0/css/all.css">
    <link rel="stylesheet" href="{% static 'main/css/ui-kit.css' %}">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <link rel="stylesheet" href="{% static 'main/css/navbar.css' %}">
</head>
<body>

  <!-- Верхняя навигационная панель -->
  <header class="top-navbar">
    <div class="navbar-container">
      <div class="navbar-logo">
        <img src="{% static 'static/main/img/logo.png' %}" alt="Логотип">
        <span>Навигация</span>
      </div>
      <nav class="navbar-menu">
        <ul>
          <li><a href="{% url 'home' %}"><i class="fas fa-home"></i> Главная</a></li>
          <li><a href="{% url 'about' %}"><i class="fas fa-info-circle"></i> Про нас</a></li>
          <li><a href="{% url 'news_home' %}"><i class="fas fa-newspaper"></i> Новости</a></li>
          <li><a href="{% url 'calc' %}"><i class="fas fa-tools"></i> Инструменты</a></li>
          <li><button class="add-record"><i class="fas fa-plus-circle"></i> Добавить запись</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

</body>
</html>
