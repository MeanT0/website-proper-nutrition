{% load  static %}
<!doctype html>
<html lang=ru>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"> <!-- bootstrap как стиль текста -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.6.0/css/all.css">
    <link rel="stylesheet" href="{% static 'main/css/ui-kit.css' %}">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">


</head>
<body>

  <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Открыть меню">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 12h18M3 6h18M3 18h18"/>
    </svg>
  </button>

  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar-drawer" id="sidebar">
    <div class="logo">
      <img src="{% static 'static/main/img/logo.png' %}" alt="">
      <h2>Навигация</h2>
    </div>
    <h3>Боковая панель</h3>
    <ul>
      <li><a href="{% url 'home' %}"><i class="fas fa-home"></i> Главная</a></li>
      <li><a href="{% url 'about' %}"><i class="fas fa-info-circle"></i> Про нас</a></li>
      <li><a href="{% url 'news_home' %}"><i class="fas fa-newspaper"></i> Новости</a></li>
      <li><a href="{% url 'calc' %}"><i class="fas fa-tools"></i> Инструменты</a></li>
      <li><button class="add-record"><i class="fas fa-plus-circle"></i> Добавить запись</button></li>
    </ul>
  </aside>

  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Скрипт в самом конце body -->
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.querySelector('.sidebar-overlay');
      const isOpen = sidebar.classList.contains('active');

      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
      document.body.style.overflow = isOpen ? '' : 'hidden';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('sidebar').classList.contains('active')) {
        toggleSidebar();
      }
    });
  </script>
</body>
</html>
