{% load  static %}
<!doctype html>
<html lang=ru>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"> <!-- bootstrap как стиль текста -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.6.0/css/all.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <link rel="stylesheet" href="{% static 'main/css/ui-kit.css' %}">

</head>
<body>
    <aside>
        <img src="{% static 'main/img/themoon6.png' %}" alt="Фото Луны">
        <span class="logo">The Moon</span>
        <h3>Навигация</h3>
        <ul> <!-- навигация, ul>li*3 -->
            <a href="{% url 'home' %}"><li><i class="fa-solid fa-house-chimney"></i> Главная</Li></a>
            <a href="{% url 'about' %}"><li><i class="fa-brands fa-wpforms"></i> Про нас</Li></a>
            <a href="{% url 'news_home' %}"><Li><i class="fa-solid fa-calculator"></i> Новости</Li></a>
            <a href="{% url 'calc' %}"><Li><i class="fa-regular fa-envelope-open"></i></i> Инструменты</Li></a>
            <a href="{% url 'create' %}"><li><button class="_gosButton_xob3k_1"><i class="fas fa-plus-circle"></i> Добавить запись</button></li></a>
            {# create это именованная сыллка в jinja #}
        </ul>
    </aside>
    <main> <!-- тут будет динамический контент -->
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
