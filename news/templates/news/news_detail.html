{% extends 'main/layout.html' %}

{% block title %}{{ news.title }}{% endblock %}

{% block content %}
<style>
  .news-detail-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  .news-detail-header {
    margin-bottom: 30px;
  }

  .news-detail-title {
    font: var(--font-h700);
    color: var(--brand-black);
    margin: 0 0 15px 0;
    line-height: 1.3;
  }

  .news-detail-date {
    font: var(--font-p100);
    color: var(--brand-violet);
    font-weight: 600;
    margin-bottom: 30px;
  }

  .news-detail-content {
    font: var(--font-p200);
    color: var(--brand-black);
    line-height: 1.8;
    opacity: 0.9;
  }

  .news-detail-content p {
    margin-bottom: 20px;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 40px;
    padding: 12px 24px;
    background: transparent;
    color: var(--brand-violet);
    border: 2px solid var(--brand-violet);
    text-decoration: none;
    border-radius: var(--radius-full);
    font: var(--font-h350);
    font-weight: 700;
    transition: all 0.3s ease;
  }

  .back-btn:hover {
    background: var(--brand-violet);
    color: white;
    transform: translateY(-2px);
  }
</style>

<div class="news-detail-container">
  <div class="news-detail-header">
    <h1 class="news-detail-title">{{ news.title }}</h1>
    <div class="news-detail-date">{{ news.date|date:"d.m.Y H:i" }}</div>
  </div>

  <div class="news-detail-content">
    {{ news.text|linebreaks }}
  </div>

  <a href="{% url 'news' %}" class="back-btn">
    ← Назад к новостям
  </a>
</div>
{% endblock %}
